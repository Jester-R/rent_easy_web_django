<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      const savedTheme = localStorage.getItem('renteasy_theme');
      const cookieTheme = document.cookie.match(/(?:^|; )renteasy_theme=([^;]+)/)?.[1];
      if ((savedTheme || cookieTheme) === 'dark') document.documentElement.classList.add('dark');
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
