<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Hanuman:wght@400;700&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem('renteasy_theme');
      const cookieTheme = document.cookie.match(/(?:^|; )renteasy_theme=([^;]+)/)?.[1];
      if ((savedTheme || cookieTheme) === 'dark') document.documentElement.classList.add('dark');
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
