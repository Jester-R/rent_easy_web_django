<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4 py-10 sm:px-6">
  <div class="w-full max-w-[30rem]">

    <div class="mb-7 flex flex-col items-center gap-3 text-center lg:hidden">
      <span class="grid h-14 w-14 place-items-center rounded-2xl hero-gradient text-white shadow-lg">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14.5 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"/><path d="M3 20.5a7.5 7.5 0 0 1 11.5-6.4"/><path d="M18.5 15.5v6M15.5 18.5h6"/></svg>
      </span>
      <div>
        <p class="text-xl font-extrabold tracking-tight">RentEasy</p>
        <p class="text-[13px] text-ink-3">Easy Rent, Happy Living</p>
      </div>
    </div>

    <div class="app-card p-6 sm:p-7">
      <div class="mb-5 flex items-center gap-3">
        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl hero-gradient text-white shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14.5 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"/><path d="M3 20.5a7.5 7.5 0 0 1 11.5-6.4"/><path d="M18.5 15.5v6M15.5 18.5h6"/></svg>
        </span>
        <div class="min-w-0">
          <h1 class="truncate text-[19px] font-extrabold tracking-tight">Create your account</h1>
          <p class="truncate text-[13px] text-ink-3">Choose your role on the next step</p>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="toast toast-error mb-4" role="alert">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10.7 3.9 2.6 17.5A1.5 1.5 0 0 0 3.9 19.8h16.2a1.5 1.5 0 0 0 1.3-2.3L13.3 3.9a1.5 1.5 0 0 0-2.6 0Z"/><path d="M12 9v4.2M12 16.4h.01"/></svg>
          <span class="flex-1">{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="form-label" for="id_full_name">Full Name</label>
          <input type="text" id="id_full_name" formControlName="full_name" class="form-input" autocomplete="name" required>
        </div>

        <div>
          <label class="form-label" for="id_username">Username</label>
          <input type="text" id="id_username" formControlName="username" class="form-input" autocomplete="username" required>
          <p class="form-hint">At least 3 alphanumeric characters.</p>
        </div>

        <div>
          <label class="form-label" for="id_email">Email</label>
          <input type="email" id="id_email" formControlName="email" class="form-input" autocomplete="email" required>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="form-label" for="id_password">Password</label>
            <input type="password" id="id_password" formControlName="password" class="form-input" autocomplete="new-password" required>
          </div>
          <div>
            <label class="form-label" for="id_password_confirm">Confirm Password</label>
            <input type="password" id="id_password_confirm" formControlName="password_confirm" class="form-input" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" [disabled]="form.invalid || isLoading()" class="btn btn-primary w-full">
          <span>{{ isLoading() ? 'Creating account...' : 'Register' }}</span>
        </button>
      </form>

      <div class="divider my-5"></div>

      <p class="text-center text-[13px] text-ink-2">
        Already have an account?
        <a routerLink="/login" class="font-bold text-primary hover:underline">Log in</a>
      </p>
    </div>
  </div>
</div>
