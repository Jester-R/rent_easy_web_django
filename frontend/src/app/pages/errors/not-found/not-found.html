<div class="mx-auto max-w-lg py-16 text-center">
  <div class="app-card px-6 py-10 text-center">
    <span class="hero-gradient mx-auto grid h-16 w-16 place-items-center rounded-2xl text-[24px] font-extrabold text-white">404</span>
    <h1 class="mt-4 text-[20px] font-extrabold tracking-tight">Page not found</h1>
    <p class="mt-2 text-[13px] text-ink-3">The page you are looking for does not exist.</p>
    <a routerLink="/" class="btn btn-primary mt-6">
      <app-icon name="arrow-left" [size]="16" />
      <span>Back home</span>
    </a>
  </div>
</div>
