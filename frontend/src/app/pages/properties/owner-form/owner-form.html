<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="app-card p-6 sm:p-10">
    <div class="flex items-center justify-between pb-6 border-b border-hairline mb-6">
      <div>
        <h1 class="text-2xl font-black text-ink">
          {{ isEdit() ? 'Edit Listing' : 'Publish New Rental Listing' }}
        </h1>
        <p class="text-xs text-ink-3 mt-1">Provide clear and accurate details for potential tenants</p>
      </div>
      <a routerLink="/owner/properties" class="text-xs font-semibold text-ink-2 hover:text-primary transition-colors">
        &larr; Back to properties
      </a>
    </div>

    @if (errorMessage()) {
      <div class="toast toast-error mb-6" role="alert">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="form-label">Property Title</label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g. Modern 2-Bedroom Condo with Balcony"
          class="form-input"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="form-label">Location / District</label>
          <input
            type="text"
            formControlName="location"
            placeholder="e.g. Phnom Penh - Toul Kork"
            class="form-input"
          />
        </div>

        <div>
          <label class="form-label">Monthly Rent ($ USD)</label>
          <input
            type="number"
            formControlName="price_per_month"
            min="1"
            class="form-input"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="form-label">Bedrooms</label>
          <input
            type="number"
            formControlName="bedrooms"
            min="0"
            class="form-input"
          />
        </div>

        <div>
          <label class="form-label">Bathrooms</label>
          <input
            type="number"
            formControlName="bathrooms"
            min="0"
            class="form-input"
          />
        </div>
      </div>

      <div>
        <label class="form-label">Full Description</label>
        <textarea
          formControlName="description"
          rows="5"
          placeholder="Describe property features, utilities, neighborhood, parking, internet, pet policy..."
          class="form-input"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-hairline">
        <a routerLink="/owner/properties" class="btn btn-ghost">
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="form.invalid || isLoading()"
          class="btn btn-primary"
        >
          @if (isLoading()) {
            Saving...
          } @else {
            {{ isEdit() ? 'Save Changes' : 'Publish Listing' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
