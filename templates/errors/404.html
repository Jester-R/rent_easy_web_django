{% extends "base.html" %}
{% load ui %}
{% block title %}404 · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
  <span class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-2xl hero-gradient text-white text-2xl font-extrabold">404</span>
  <h1 class="text-xl font-extrabold tracking-tight">{% t 'no_results' %}</h1>
  <p class="mt-2 text-[13px] text-ink-3">{% t 'no_properties_match' %}</p>
  <a href="/" class="btn btn-primary mt-6">{% icon "arrow-left" 16 %} {% t 'back' %}</a>
</div>
{% endblock %}
