{% load ui %}
<div class="app-card flex flex-col items-center gap-3 px-6 py-12 text-center">
  <span class="empty-state-icon">{% icon icon 30 %}</span>
  <p class="text-[15px] font-bold text-ink">{{ title }}</p>
  {% if subtitle %}<p class="max-w-sm text-[13px] leading-relaxed text-ink-3">{{ subtitle }}</p>{% endif %}
  {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-primary btn-sm mt-1">{% icon action_icon|default:"arrow-right" 15 %} {{ action_label|default:'back'|t }}</a>
  {% endif %}
  {% block empty_extra %}{% endblock %}
</div>
