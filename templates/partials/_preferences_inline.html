{% load ui %}
{# Theme toggle #}
<form method="post" action="{% url 'set_theme' %}" class="contents">
  {% csrf_token %}
  <input type="hidden" name="theme" value="{% if IS_DARK %}light{% else %}dark{% endif %}">
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-ghost btn-icon" title="{% t 'change_theme' %}" aria-label="{% t 'change_theme' %}">
    {% if IS_DARK %}{% icon "sun" 18 %}{% else %}{% icon "moon" 18 %}{% endif %}
  </button>
</form>

{# Language toggle — one click posts the other language, same as the theme #}
<form method="post" action="{% url 'set_language' %}" class="contents">
  {% csrf_token %}
  <input type="hidden" name="lang" value="{{ OTHER_LANGUAGE.code }}">
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-ghost gap-1.5 px-2.5"
          title="{% t 'change_language' %}" aria-label="{% t 'change_language' %}">
    {% icon "globe" 18 %}
    <span class="hidden text-[13px] font-bold sm:inline">{{ OTHER_LANGUAGE.native_label }}</span>
  </button>
</form>
