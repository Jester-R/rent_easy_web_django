{% load ui %}
<div class="stat-card">
  <span class="stat-icon">{% icon icon 20 %}</span>
  <span class="min-w-0">
    <span class="block text-[11px] font-bold uppercase tracking-wide text-ink-3">{{ label }}</span>
    <span class="block truncate text-[19px] font-extrabold leading-tight">{{ value }}</span>
    {% if hint %}<span class="block truncate text-[11px] text-ink-3">{{ hint }}</span>{% endif %}
  </span>
</div>
