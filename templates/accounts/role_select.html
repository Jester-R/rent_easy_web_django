{% extends "base.html" %}
{% load ui %}

{% block title %}{% t 'select_role' %} · {{ SITE_NAME }}{% endblock %}
{% block content_wrapper %}
<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4 py-10 sm:px-6">
  <div class="w-full max-w-[35rem]">
    <div class="app-card p-6 sm:p-7">
      <div class="mb-6 text-center">
        <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl hero-gradient text-white shadow-sm">{% icon "shield" 22 %}</span>
        <h1 class="text-[20px] font-extrabold tracking-tight">{% t 'select_role' %}</h1>
        <p class="mt-1 text-[13px] text-ink-3">{% t 'select_role_hint' %}</p>
        <p class="mt-2 inline-flex items-center gap-1.5 rounded-full bg-surface-2 px-3 py-1 text-[12px] font-bold text-ink-2">
          {% icon "user" 13 %} {{ pending_user.email }}
        </p>
      </div>

      <form method="post" class="grid gap-3 sm:grid-cols-2">
        {% csrf_token %}

        <label class="group relative flex cursor-pointer flex-col gap-2 rounded-2xl border-2 border-hairline bg-surface-2 p-5 transition-all hover:border-primary has-[:checked]:border-primary has-[:checked]:bg-primary-soft">
          <input type="radio" name="role" value="renter" class="sr-only" required>
          <span class="flex items-center gap-3">
            <span class="grid h-11 w-11 place-items-center rounded-xl bg-primary-soft text-primary-dark transition-transform group-hover:scale-105">{% icon "user-search" 22 %}</span>
            <span>
              <span class="block text-[15px] font-extrabold text-ink">{% t 'renter' %}</span>
              <span class="block text-[12px] leading-snug text-ink-3">{% t 'renter_role_hint' %}</span>
            </span>
          </span>
          <span class="pointer-events-none absolute end-3 top-3 hidden text-primary group-has-[:checked]:block">{% icon "check-circle" 20 %}</span>
        </label>

        <label class="group relative flex cursor-pointer flex-col gap-2 rounded-2xl border-2 border-hairline bg-surface-2 p-5 transition-all hover:border-primary has-[:checked]:border-primary has-[:checked]:bg-primary-soft">
          <input type="radio" name="role" value="owner" class="sr-only" required>
          <span class="flex items-center gap-3">
            <span class="grid h-11 w-11 place-items-center rounded-xl bg-primary-soft text-primary-dark transition-transform group-hover:scale-105">{% icon "store" 22 %}</span>
            <span>
              <span class="block text-[15px] font-extrabold text-ink">{% t 'property_owner' %}</span>
              <span class="block text-[12px] leading-snug text-ink-3">{% t 'owner_role_hint' %}</span>
            </span>
          </span>
          <span class="pointer-events-none absolute end-3 top-3 hidden text-primary group-has-[:checked]:block">{% icon "check-circle" 20 %}</span>
        </label>

        <div class="sm:col-span-2">
          <button type="submit" class="btn btn-primary w-full">{% icon "check" 16 %} {% t 'confirm' %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
